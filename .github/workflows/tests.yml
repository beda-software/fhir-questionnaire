name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Yarn 4 is pinned via packageManager; setup-node cache needs it before running
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - run: yarn install --immutable

      - run: yarn test
